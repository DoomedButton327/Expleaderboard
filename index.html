<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06040f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MS League">
    <meta name="description" content="Mettlestate × EA FC Mobile League — Live Standings">
    <title>Mettlestate × EA FC Mobile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ======================================================
           DESIGN SYSTEM — Deep Space Glassmorphism / Mobile-Firstd
           ====================================================== */
        :root {
            --bg:         #06040f;
            --surface:    rgba(255,255,255,0.04);
            --surface-hi: rgba(255,255,255,0.07);
            --border:     rgba(255,255,255,0.08);
            --border-hi:  rgba(139,92,246,0.4);
            --purple:     #8b5cf6;
            --blue:       #38bdf8;
            --gold:       #f59e0b;
            --green:      #10b981;
            --red:        #ef4444;
            --text:       #e2e8f0;
            --muted:      #64748b;
            --win:        #10b981;
            --draw:       #f59e0b;
            --loss:       #ef4444;
            --sat: env(safe-area-inset-top,    0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left,   0px);
            --sar: env(safe-area-inset-right,  0px);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-bottom: calc(32px + var(--sab));
        }

        /* ---- BACKGROUND ---- */
        #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

        .grid-overlay {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(139,92,246,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139,92,246,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .orb { position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0; }
        .orb-1 { width:60vw; height:60vw; top:-10vw; left:-20vw; background:rgba(124,58,237,0.14); }
        .orb-2 { width:50vw; height:50vw; bottom:-10vw; right:-15vw; background:rgba(59,130,246,0.10); }

        /* ---- STICKY HEADER ---- */
        .sticky-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(6,4,15,0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: calc(var(--sat) + 12px) calc(16px + var(--sar)) 12px calc(16px + var(--sal));
            display: flex; align-items: center; gap: 12px;
        }

        .logo-sm {
            width: 32px; height: 32px; object-fit: contain; flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(139,92,246,0.6));
        }

        .header-text { flex: 1; min-width: 0; }

        .sticky-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem; font-weight: 900; letter-spacing: 0.05em;
            background: linear-gradient(90deg, #c4b5fd, #38bdf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .sticky-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem; color: var(--muted); letter-spacing: 0.1em; margin-top: 1px;
        }

        .live-pill {
            display: flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 999px;
            background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.56rem; color: var(--green); white-space: nowrap; flex-shrink: 0;
        }
        .live-pill::before {
            content: ''; width: 5px; height: 5px; border-radius: 50%;
            background: var(--green); animation: pulse 2s infinite;
        }

        /* ---- LAYOUT ---- */
        .app {
            position: relative; z-index: 1;
            padding: 14px calc(12px + var(--sar)) 0 calc(12px + var(--sal));
            max-width: 680px; margin: 0 auto;
        }

        /* ---- PULL-TO-REFRESH ---- */
        .ptr-indicator {
            text-align: center; padding: 8px 0 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem; color: var(--purple); letter-spacing: 0.1em;
            opacity: 0; transition: opacity 0.2s;
        }
        .ptr-indicator.visible { opacity: 1; }

        /* ---- LAST UPDATED ---- */
        .update-row {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem; color: var(--muted); margin-bottom: 14px;
            animation: fadeUp 0.45s ease both;
        }
        .update-row i { font-size: 0.52rem; }

        /* ---- PODIUM ---- */
        .podium-wrap { margin-bottom: 12px; animation: fadeUp 0.4s ease 0.05s both; }

        .podium {
            display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; align-items: end;
        }

        .podium-card {
            border-radius: 14px; padding: 14px 8px 12px; text-align: center;
            border: 1px solid var(--border); background: var(--surface);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        .podium-card.rank-1 { border-color:rgba(245,158,11,0.4); background:linear-gradient(160deg,rgba(245,158,11,0.14),rgba(245,158,11,0.04)); padding-top:18px; }
        .podium-card.rank-2 { border-color:rgba(148,163,184,0.25); background:rgba(148,163,184,0.06); }
        .podium-card.rank-3 { border-color:rgba(180,120,80,0.25);  background:rgba(180,120,80,0.06); }

        .podium-medal { font-size: 1.6rem; display: block; margin-bottom: 6px; }
        .podium-name  { font-family:'Orbitron',sans-serif; font-size:0.62rem; font-weight:700; letter-spacing:0.04em; word-break:break-word; }
        .podium-pts   { font-family:'JetBrains Mono',monospace; font-size:0.64rem; color:var(--muted); margin-top:4px; }
        .podium-pts strong { color:var(--gold); }

        /* ---- SECTION LABEL ---- */
        .section-label {
            font-family: 'Orbitron', sans-serif; font-size: 0.62rem; font-weight: 700;
            letter-spacing: 0.16em; color: var(--muted); margin: 18px 4px 10px;
            display: flex; align-items: center; gap: 8px;
            animation: fadeUp 0.4s ease 0.1s both;
        }
        .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

        /* ============================================================
           TABS
           ============================================================ */
        .tab-bar {
            display: flex; gap: 6px; margin-bottom: 14px;
            padding: 4px; border-radius: 14px;
            background: var(--surface); border: 1px solid var(--border);
            animation: fadeUp 0.4s ease 0.05s both;
        }
        .tab-btn {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
            padding: 9px 10px; border: none; border-radius: 10px;
            background: transparent; color: var(--muted); cursor: pointer;
            font-family: 'Syne', sans-serif; font-size: 0.74rem; font-weight: 700;
            letter-spacing: 0.01em; transition: background 0.18s, color 0.18s;
        }
        .tab-btn i { font-size: 0.72rem; }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(56,189,248,0.12));
            color: #e9e4ff;
            box-shadow: inset 0 0 0 1px rgba(139,92,246,0.35);
        }
        .tab-btn:not(.active):hover { color: #cbd5e1; background: rgba(255,255,255,0.03); }

        .tab-panel { animation: fadeUp 0.3s ease both; }

        /* ============================================================
           MATCH HISTORY — search + list
           ============================================================ */
        .history-search-wrap {
            position: relative; display: flex; align-items: center;
            margin-bottom: 14px;
        }
        .history-search-wrap > i.fa-magnifying-glass {
            position: absolute; left: 14px; font-size: 0.72rem; color: var(--muted); pointer-events: none;
        }
        .history-search {
            width: 100%; padding: 12px 38px 12px 36px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
            outline: none; transition: border-color 0.18s, background 0.18s;
        }
        .history-search::placeholder { color: var(--muted); }
        .history-search:focus { border-color: var(--border-hi); background: var(--surface-hi); }
        .history-clear {
            position: absolute; right: 8px; width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            border: none; border-radius: 50%; background: rgba(255,255,255,0.06);
            color: var(--muted); cursor: pointer; font-size: 0.7rem;
        }
        .history-clear:hover { background: rgba(255,255,255,0.1); color: var(--text); }

        .history-summary {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 12px 14px; border-radius: 12px; margin-bottom: 12px;
            background: var(--surface); border: 1px solid var(--border);
            animation: fadeUp 0.3s ease both;
        }
        .history-summary .hs-name {
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.86rem; color: var(--text);
        }
        .history-summary .hs-record {
            font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--muted);
            display: flex; gap: 8px; margin-left: auto;
        }
        .hs-record .w { color: var(--win); } .hs-record .d { color: var(--draw); } .hs-record .l { color: var(--loss); }

        .match-list { display: flex; flex-direction: column; gap: 7px; }

        .match-card {
            display: grid; grid-template-columns: 34px 1fr auto; align-items: center;
            gap: 10px; padding: 11px 13px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            animation: fadeUp 0.3s ease both;
        }
        .match-card.mc-w { border-left: 3px solid var(--win); }
        .match-card.mc-d { border-left: 3px solid var(--draw); }
        .match-card.mc-l { border-left: 3px solid var(--loss); }

        .mc-result {
            width: 30px; height: 30px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.72rem;
        }
        .mc-result.mc-w { background: rgba(16,185,129,0.15); color: var(--win); border: 1px solid rgba(16,185,129,0.3); }
        .mc-result.mc-d { background: rgba(245,158,11,0.15); color: var(--draw); border: 1px solid rgba(245,158,11,0.3); }
        .mc-result.mc-l { background: rgba(239,68,68,0.15); color: var(--loss); border: 1px solid rgba(239,68,68,0.3); }

        .mc-matchup {
            font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .mc-matchup .vs { color: var(--muted); margin: 0 4px; font-size: 0.65rem; }
        .mc-date { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }

        .mc-score {
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 0.92rem;
            color: #c4b5fd; white-space: nowrap;
        }

        /* ============================================================
           TODAY — today's fixtures + postponed (blue) section
           ============================================================ */
        .fixture-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 4px; }

        .fixture-card {
            display: grid; grid-template-columns: 1fr auto; align-items: center;
            gap: 10px; padding: 12px 14px; border-radius: 12px;
            background: var(--surface); border: 1px solid var(--border);
            border-left: 3px solid var(--gold);
            animation: fadeUp 0.3s ease both;
        }
        .fixture-card.fc-postponed { border-left-color: var(--blue); }

        .fc-matchup {
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.86rem; color: var(--text);
        }
        .fc-matchup .vs { color: var(--muted); font-weight: 400; margin: 0 6px; font-size: 0.7rem; }
        .fc-meta { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-top: 3px; }

        .fc-pill {
            padding: 4px 10px; border-radius: 999px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.56rem; font-weight: 700; letter-spacing: 0.06em;
            white-space: nowrap;
            background: rgba(245,158,11,0.14); border: 1px solid rgba(245,158,11,0.3); color: var(--gold);
        }
        .fc-pill.fc-pill-postponed { background: rgba(56,189,248,0.14); border-color: rgba(56,189,248,0.3); color: var(--blue); }

        /* ============================================================
           PROFILE — login + player profile card + status gauge
           ============================================================ */
        .profile-login {
            padding: 24px 18px; border-radius: 16px; text-align: center;
            background: var(--surface); border: 1px solid var(--border);
            animation: fadeUp 0.35s ease both;
        }
        .profile-login i.pl-icon { font-size: 1.8rem; color: var(--purple); margin-bottom: 10px; display: block; }
        .profile-login h3 { font-family: 'Orbitron', sans-serif; font-size: 0.86rem; margin-bottom: 6px; }
        .profile-login p { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }

        .profile-input-wrap { display: flex; gap: 8px; }
        .profile-input {
            flex: 1; padding: 12px 14px; border-radius: 10px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
            outline: none; transition: border-color 0.18s;
        }
        .profile-input::placeholder { color: var(--muted); }
        .profile-input:focus { border-color: var(--border-hi); }
        .profile-submit {
            padding: 0 18px; border-radius: 10px; border: none; cursor: pointer;
            background: linear-gradient(135deg, var(--purple), #6d28d9);
            color: #fff; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.78rem;
        }
        .profile-error { color: var(--red); font-family: 'JetBrains Mono', monospace; font-size: 0.64rem; margin-top: 10px; }

        .profile-card {
            padding: 20px 18px; border-radius: 16px; text-align: center;
            background: var(--surface); border: 1px solid var(--border);
            margin-bottom: 14px; animation: fadeUp 0.35s ease both;
        }
        .profile-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; }
        .profile-username { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--muted); margin-top: 2px; }

        .gauge-wrap { position: relative; width: 132px; height: 132px; margin: 18px auto 10px; }
        .gauge-wrap svg { transform: rotate(-90deg); }
        .gauge-center {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 2px;
        }
        .gauge-center i { font-size: 1.15rem; }
        .gauge-status-label {
            font-family: 'Orbitron', sans-serif; font-size: 0.56rem; font-weight: 700;
            letter-spacing: 0.08em; text-align: center; line-height: 1.3; max-width: 80px;
        }
        .gauge-caption { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-top: 6px; }

        .profile-stat-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px;
        }
        .profile-stat { padding: 8px 4px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
        .profile-stat .ps-val { display: block; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1rem; color: #c4b5fd; }
        .profile-stat .ps-lbl { font-family: 'JetBrains Mono', monospace; font-size: 0.52rem; color: var(--muted); letter-spacing: 0.06em; }

        .profile-logout {
            margin-top: 16px; padding: 9px 16px; border-radius: 10px;
            background: transparent; border: 1px solid var(--border); color: var(--muted);
            font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; cursor: pointer;
        }
        .profile-logout:hover { color: var(--text); border-color: var(--border-hi); }

        .evidence-thumb {
            width: 30px; height: 30px; border-radius: 7px; object-fit: cover;
            border: 1px solid var(--border); cursor: pointer; flex-shrink: 0;
        }
        .mc-evidence-wrap { display: flex; align-items: center; gap: 8px; }

        .lightbox {
            position: fixed; inset: 0; z-index: 200; background: rgba(4,2,10,0.92);
            display: flex; align-items: center; justify-content: center; padding: 24px;
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; border: 1px solid var(--border); }
        .lightbox-close {
            position: absolute; top: calc(var(--sat) + 16px); right: 16px;
            width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
            background: rgba(255,255,255,0.06); color: var(--text); font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
        }

        /* ============================================================
           MOBILE PLAYER CARDS
           ============================================================ */
        .player-list { display: flex; flex-direction: column; gap: 8px; }

        .player-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 14px; padding: 13px 14px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: grid; grid-template-columns: 36px 1fr auto;
            gap: 0 12px; align-items: center;
            animation: fadeUp 0.35s ease both;
            -webkit-user-select: none; user-select: none;
        }
        .player-card.zone-champ  { border-color: rgba(139,92,246,0.22); }
        .player-card.zone-danger { border-color: rgba(239,68,68,0.22); }

        .pc-rank {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
            font-family: 'Orbitron', sans-serif; font-size: 0.78rem; font-weight: 900;
            border: 1px solid var(--border); color: var(--muted);
        }
        .pc-rank.pos-1 { background:rgba(245,158,11,0.15); border-color:rgba(245,158,11,0.45); color:#f59e0b; }
        .pc-rank.pos-2 { background:rgba(148,163,184,0.1);  border-color:rgba(148,163,184,0.35); color:#cbd5e1; }
        .pc-rank.pos-3 { background:rgba(180,120,80,0.1);   border-color:rgba(180,120,80,0.35);  color:#cd9161; }

        .pc-info { min-width: 0; }

        .pc-name {
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem;
            color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .pc-username {
            font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--muted);
            margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .pc-stats { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }

        .pc-stat {
            font-family: 'JetBrains Mono', monospace; font-size: 0.58rem; color: var(--muted);
            background: rgba(255,255,255,0.035); border: 1px solid var(--border);
            border-radius: 5px; padding: 2px 6px;
        }
        .pc-stat span { color: #94a3b8; font-weight: 500; }

        .pc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }

        .pc-pts { font-family:'Orbitron',sans-serif; font-size:1.25rem; font-weight:900; color:#c4b5fd; line-height:1; }
        .pc-pts-label { font-family:'JetBrains Mono',monospace; font-size:0.5rem; color:var(--muted); letter-spacing:0.1em; text-align:right; margin-top:-1px; }

        .pc-form { display: flex; gap: 3px; }
        .f-w, .f-d, .f-l {
            width: 16px; height: 16px; border-radius: 4px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.55rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .f-w { background:rgba(16,185,129,0.2);  color:var(--win);  border:1px solid rgba(16,185,129,0.35); }
        .f-d { background:rgba(245,158,11,0.2);  color:var(--draw); border:1px solid rgba(245,158,11,0.35); }
        .f-l { background:rgba(239,68,68,0.2);   color:var(--loss); border:1px solid rgba(239,68,68,0.35); }

        .gd-pos { color: var(--green); }
        .gd-neg { color: var(--red); }

        /* ---- POSTPONEMENT PILL ---- */
        .postponement-badge {
            display: inline-flex; align-items: center; gap: 5px;
            margin-top: 6px;
            padding: 3px 8px 3px 6px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(245,158,11,0.14), rgba(245,158,11,0.05));
            border: 1px solid rgba(245,158,11,0.28);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
            color: #fbbf24;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.56rem; font-weight: 600; letter-spacing: 0.02em;
            line-height: 1; white-space: nowrap;
        }
        .postponement-badge i {
            display: inline-flex; align-items: center; justify-content: center;
            width: 12px; height: 12px; border-radius: 50%;
            background: rgba(245,158,11,0.18); color: #f59e0b; font-size: 0.48rem;
        }
        .postponement-badge .pp-count { color: #fde68a; font-weight: 700; }

        /* ============================================================
           DESKTOP TABLE — hidden by default, shown ≥ 680px
           ============================================================ */
        .desktop-table-wrap { display: none; }

        /* ---- LEGEND ---- */
        .legend {
            display: flex; gap: 14px; padding: 12px 4px; flex-wrap: wrap;
            animation: fadeUp 0.4s ease 0.15s both;
        }
        .legend-item { display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:0.59rem; color:var(--muted); }
        .legend-dot { width:8px; height:8px; border-radius:3px; }
        .legend-dot.champ  { background:rgba(139,92,246,0.55); }
        .legend-dot.danger { background:rgba(239,68,68,0.55); }

        /* ---- SKELETON ---- */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface-hi) 50%, var(--surface) 75%);
            background-size: 200% 100%; animation: shimmer 1.4s infinite;
        }
        .sk-card { height: 76px; border-radius: 14px; margin-bottom: 8px; }

        /* ---- EMPTY STATE ---- */
        .empty-state {
            text-align:center; padding:60px 20px; color:var(--muted);
            font-family:'JetBrains Mono',monospace; font-size:0.8rem; line-height:1.9;
        }
        .empty-state i { display:block; font-size:2.2rem; margin-bottom:14px; opacity:0.25; }

        /* ---- FOOTER ---- */
        footer {
            text-align:center; margin-top:36px; padding:0 16px;
            font-family:'JetBrains Mono',monospace; font-size:0.59rem;
            color:var(--muted); letter-spacing:0.07em; line-height:2.1;
            animation: fadeUp 0.5s ease 0.2s both;
        }
        footer a { color:var(--purple); text-decoration:none; }

        /* ---- ANIMATIONS ---- */
        @keyframes fadeUp   { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
        @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:0.35} }
        @keyframes shimmer  { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ============================================================
           DESKTOP — ≥ 680px
           ============================================================ */
        @media (min-width: 680px) {
            .sticky-title { font-size: 1rem; }
            .logo-sm { width: 40px; height: 40px; }
            .podium-medal { font-size: 2rem; }
            .podium-name  { font-size: 0.72rem; }

            .player-list        { display: none; }
            .desktop-table-wrap { display: block; overflow-x: auto; }

            table { width: 100%; border-collapse: collapse; }

            thead th {
                font-family:'Orbitron',sans-serif; font-size:0.6rem; font-weight:700;
                letter-spacing:0.12em; color:var(--muted); padding:12px 10px;
                text-align:center; border-bottom:1px solid var(--border); white-space:nowrap;
            }
            thead th:nth-child(2) { text-align: left; }

            tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); transition:background 0.15s; }
            tbody tr:hover { background: var(--surface-hi); }
            tbody tr:last-child { border-bottom: none; }
            tbody tr.zone-champ  { background: rgba(139,92,246,0.04); }
            tbody tr.zone-danger { background: rgba(239,68,68,0.04); }

            tbody td {
                font-family:'JetBrains Mono',monospace; font-size:0.78rem;
                padding:11px 10px; text-align:center; color:#94a3b8;
            }
            tbody td:nth-child(2) { text-align: left; }

            .pos-badge {
                display:inline-flex; align-items:center; justify-content:center;
                width:28px; height:28px; border-radius:7px;
                font-family:'Orbitron',sans-serif; font-size:0.65rem; font-weight:700;
                border:1px solid var(--border); color:var(--muted);
            }
            .pos-badge.pos-1 { background:rgba(245,158,11,0.15); border-color:rgba(245,158,11,0.45); color:#f59e0b; }
            .pos-badge.pos-2 { background:rgba(148,163,184,0.1);  border-color:rgba(148,163,184,0.35); color:#cbd5e1; }
            .pos-badge.pos-3 { background:rgba(180,120,80,0.1);   border-color:rgba(180,120,80,0.35);  color:#cd9161; }

            .dt-name     { color:var(--text); font-weight:500; font-size:0.82rem; }
            .dt-username { font-size:0.62rem; color:var(--muted); margin-top:2px; }
            .pts-cell    { color:#c4b5fd; font-weight:700; font-size:0.92rem; }

            .form-badges { display:flex; gap:3px; justify-content:center; }
            .form-w, .form-d, .form-l {
                display:inline-flex; align-items:center; justify-content:center;
                width:18px; height:18px; border-radius:4px; font-size:0.58rem; font-weight:700;
                font-family:'JetBrains Mono',monospace;
            }
            .form-w { background:rgba(16,185,129,0.2); color:var(--win);  border:1px solid rgba(16,185,129,0.3); }
            .form-d { background:rgba(245,158,11,0.2); color:var(--draw); border:1px solid rgba(245,158,11,0.3); }
            .form-l { background:rgba(239,68,68,0.2);  color:var(--loss); border:1px solid rgba(239,68,68,0.3); }
        }
    </style>
</head>
<body>

<!-- STICKY HEADER -->

<!-- MAIN -->
<div class="app">

    <div class="ptr-indicator" id="ptr-indicator"><i class="fas fa-sync-alt"></i> &nbsp;REFRESHING…</div>

    <div class="update-row">
        <i class="fas fa-clock"></i>

    <!-- TABS -->
    <div class="tab-bar" role="tablist">

        <i class="fas fa-shield-halved" style="color:var(--purple)"></i>
        &nbsp;Read-only view — admin access is separate
    </footer>

<script>
/* ============================================================
   PUBLIC LEADERBOARD — Mobile-First Read-only Viewer
   ============================================================ */

// ---- STARFIELD ----
(function () {
    const canvas = document.getElementById('starfield');
    const ctx    = canvas.getContext('2d');
    let stars    = [];

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }

    function initStars(n) {
        stars = [];
        for (let i = 0; i < n; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.1 + 0.2,
                alpha: Math.random() * 0.55 + 0.1,
                speed: Math.random() * 0.012 + 0.004,
                phase: Math.random() * Math.PI * 2
            });
        }
    }

    let t = 0;
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        t += 0.007;
        stars.forEach(s => {
            const a = s.alpha * (0.5 + 0.5 * Math.sin(t * s.speed * 60 + s.phase));
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200,190,255,${a})`;
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }

    resize(); initStars(160); draw();
    window.addEventListener('resize', () => { resize(); initStars(160); });
})();

// ---- PULL-TO-REFRESH ----
let ptrStart = 0, ptrActive = false;
const ptrEl  = document.getElementById('ptr-indicator');

document.addEventListener('touchstart', e => {
    if (window.scrollY === 0) ptrStart = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchmove', e => {
    if (ptrStart && window.scrollY === 0 && e.touches[0].clientY - ptrStart > 60 && !ptrActive) {
        ptrActive = true;
        ptrEl.classList.add('visible');
    }
}, { passive: true });

document.addEventListener('touchend', () => {
    if (ptrActive) {
        ptrActive = false;
        loadData().finally(() => ptrEl.classList.remove('visible'));
    }
    ptrStart = 0;
}, { passive: true });

// ---- DATA ----
let LEAGUE_PLAYERS  = [];
let LEAGUE_RESULTS  = [];
let LEAGUE_FIXTURES = { today: [], postponed: [] };

const PROFILE_COOKIE = 'ms_league_profile';
const STATUS_COLORS  = { red: '#ef4444', blue: '#38bdf8', gold: '#f59e0b', purple: '#8b5cf6', green: '#10b981' };

async function loadData() {
    try {
        const res  = await fetch('./data/league-data.json?_=' + Date.now());
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();
        LEAGUE_PLAYERS  = data.players  || [];
        LEAGUE_RESULTS  = data.results  || [];
        LEAGUE_FIXTURES = data.fixtures || { today: [], postponed: [] };
        renderStandings(LEAGUE_PLAYERS);
        renderToday();
        // Re-run any active search against the freshly loaded results
        const searchEl = document.getElementById('history-search');
        if (searchEl && searchEl.value.trim()) {
            renderMatchHistory(searchEl.value.trim());
        }
        // If a profile is currently loaded (or remembered via cookie), refresh it too
        refreshProfileIfLoaded();
        const lu = document.getElementById('last-updated');
        lu.textContent = data.updatedAt
        ? new Date(data.updatedAt).toLocaleString('en-ZA', {
        dateStyle: 'medium',
        timeStyle: 'short'
      })
    : new Date().toLocaleTimeString('en-ZA');
    } catch (e) {
        document.getElementById('standings-root').innerHTML =
            '<div class="empty-state"><i class="fas fa-satellite-dish"></i>Could not load league data.<br>Check back soon.</div>';
    }
}

// ---- TABS ----
const TAB_NAMES = ['standings', 'today', 'history', 'profile'];

function switchTab(tab) {
    TAB_NAMES.forEach(name => {
        const active = name === tab;
        const panel  = document.getElementById(`${name}-panel`);
        const btn    = document.getElementById(`tab-btn-${name}`);
        if (panel) panel.hidden = !active;
        if (btn) {
            btn.classList.toggle('active', active);
            btn.setAttribute('aria-selected', String(active));
        }
    });

    if (tab === 'history') {
        const searchEl = document.getElementById('history-search');
        setTimeout(() => searchEl && searchEl.focus(), 50);
    }
}

// ---- TODAY ----
function renderToday() {
    const root = document.getElementById('today-root');
    const todayList     = LEAGUE_FIXTURES.today     || [];
    const postponedList = LEAGUE_FIXTURES.postponed || [];

    if (!todayList.length && !postponedList.length) {
        root.innerHTML = '<div class="empty-state"><i class="fas fa-mug-hot"></i>No games scheduled today.<br>Check back once fixtures drop.</div>';
        return;
    }

    const fixtureCard = (f, postponed) => `
        <div class="fixture-card ${postponed ? 'fc-postponed' : ''}" style="animation-delay:0.03s">
            <div>
                <div class="fc-matchup">${esc(f.home)}<span class="vs">vs</span>${esc(f.away)}</div>
                <div class="fc-meta">${f.date ? esc(f.date) : ''}${postponed && f.postponedBy ? ` · postponed by ${esc(f.postponedBy)}` : ''}</div>
            </div>
            <div class="fc-pill ${postponed ? 'fc-pill-postponed' : ''}">${postponed ? 'POSTPONED' : 'TODAY'}</div>
        </div>`;

    let html = '';
    if (todayList.length) {
        html += `<div class="section-label"><i class="fas fa-calendar-day"></i> TODAY'S FIXTURES · ${todayList.length}</div>
                  <div class="fixture-list">${todayList.map(f => fixtureCard(f, false)).join('')}</div>`;
    }
    if (postponedList.length) {
        html += `<div class="section-label"><i class="fas fa-hourglass-half"></i> POSTPONED · ${postponedList.length}</div>
                  <div class="fixture-list">${postponedList.map(f => fixtureCard(f, true)).join('')}</div>`;
    }
    root.innerHTML = html;
}

// ---- MATCH HISTORY SEARCH ----
let historySearchDebounce = null;

function onHistorySearch(value) {
    const clearBtn = document.getElementById('history-clear');
    clearBtn.hidden = !value.trim();
    clearTimeout(historySearchDebounce);
    historySearchDebounce = setTimeout(() => renderMatchHistory(value.trim()), 120);
}

function clearHistorySearch() {
    const searchEl = document.getElementById('history-search');
    searchEl.value = '';
    document.getElementById('history-clear').hidden = true;
    renderMatchHistory('');
    searchEl.focus();
}

// Builds one match-card row. Shared by the History tab and the Profile tab so
// results look identical everywhere, evidence thumbnail included when present.
function buildMatchCardHTML(m, username, i) {
    const isHome   = m.home === username;
    const opponent = isHome ? m.away : m.home;
    const myGoals  = isHome ? (m.homeGoals || 0) : (m.awayGoals || 0);
    const oppGoals = isHome ? (m.awayGoals || 0) : (m.homeGoals || 0);

    let outcome, label;
    if (myGoals > oppGoals) { outcome = 'w'; label = 'W'; }
    else if (myGoals < oppGoals) { outcome = 'l'; label = 'L'; }
    else { outcome = 'd'; label = 'D'; }

    const dateStr = m.date
        ? new Date(m.date + 'T00:00:00').toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' })
        : '—';

    const evidence = m.evidence
        ? `<img src="${esc(m.evidence)}" class="evidence-thumb" alt="Match evidence" onclick="openLightbox('${esc(m.evidence)}')">`
        : '';

    return `
    <div class="match-card mc-${outcome}" style="animation-delay:${Math.min(i,10) * 0.03}s">
        <div class="mc-result mc-${outcome}">${label}</div>
        <div class="mc-evidence-wrap">
            <div>
                <div class="mc-matchup">${esc(username)}<span class="vs">vs</span>${esc(opponent)}</div>
                <div class="mc-date">${dateStr}</div>
            </div>
            ${evidence}
        </div>
        <div class="mc-score">${myGoals}–${oppGoals}</div>
    </div>`;
}

// ---- LIGHTBOX (tap an evidence thumbnail to enlarge) ----
function openLightbox(src) {
    closeLightbox();
    const box = document.createElement('div');
    box.className = 'lightbox';
    box.id = 'lightbox';
    box.onclick = closeLightbox;
    box.innerHTML = `<button class="lightbox-close" onclick="closeLightbox(event)"><i class="fas fa-xmark"></i></button><img src="${esc(src)}" alt="Match evidence">`;
    document.body.appendChild(box);
}
function closeLightbox(e) {
    if (e) e.stopPropagation();
    const box = document.getElementById('lightbox');
    if (box) box.remove();
}

function renderMatchHistory(query) {
    const root = document.getElementById('history-root');

    if (!query) {
        root.innerHTML = '<div class="empty-state"><i class="fas fa-user-magnifying-glass"></i>Search a username above<br>to see their match history.</div>';
        return;
    }

    const q = query.toLowerCase();
    // Match by username (exact-ish, case-insensitive contains) so partial typing still works
    const player = LEAGUE_PLAYERS.find(p => (p.username || '').toLowerCase() === q)
                || LEAGUE_PLAYERS.find(p => (p.username || '').toLowerCase().includes(q));

    if (!player) {
        root.innerHTML = `<div class="empty-state"><i class="fas fa-circle-question"></i>No player found matching<br>"${esc(query)}".</div>`;
        return;
    }

    const username = player.username;
    const matches = LEAGUE_RESULTS.filter(r => r.home === username || r.away === username);

    if (!matches.length) {
        root.innerHTML = `<div class="empty-state"><i class="fas fa-futbol"></i>${esc(player.name)} hasn't played<br>any matches yet.</div>`;
        return;
    }

    // Most recent first
    const sortedMatches = [...matches].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    let wins = 0, draws = 0, losses = 0;
    // Tally first (buildMatchCardHTML doesn't tally, so history keeps its own count)
    sortedMatches.forEach(m => {
        const isHome  = m.home === username;
        const myGoals  = isHome ? (m.homeGoals || 0) : (m.awayGoals || 0);
        const oppGoals = isHome ? (m.awayGoals || 0) : (m.homeGoals || 0);
        if (myGoals > oppGoals) wins++; else if (myGoals < oppGoals) losses++; else draws++;
    });
    const cards = sortedMatches.map((m, i) => buildMatchCardHTML(m, username, i)).join('');

    root.innerHTML = `
        <div class="history-summary">
            <div class="hs-name">${esc(player.name)} <span style="color:var(--muted);font-weight:400;">@${esc(username)}</span></div>
            <div class="hs-record">
                <span class="w">${wins}W</span>
                <span class="d">${draws}D</span>
                <span class="l">${losses}L</span>
                &nbsp;·&nbsp; ${matches.length} games
            </div>
        </div>
        <div class="match-list">${cards}</div>`;
}

// ---- RENDER STANDINGS ----
function renderStandings(players) {
    const root = document.getElementById('standings-root');

    // Suspended players are hidden from the public leaderboard entirely
    const active = (players || []).filter(p => !p.suspended);

    if (!active.length) {
        root.innerHTML = '<div class="empty-state"><i class="fas fa-trophy"></i>No players registered yet.<br>Check back once the league kicks off.</div>';
        return;
    }

    const sorted = [...active].sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        const gdA = (a.gf||0)-(a.ga||0), gdB = (b.gf||0)-(b.ga||0);
        return gdA !== gdB ? gdB - gdA : (b.gf||0) - (a.gf||0);
    });

    // ---- PODIUM ----
    let podiumHTML = '';
    if (sorted.length >= 3) {
        const [first, second, third] = sorted;
        podiumHTML = `
        <div class="podium-wrap">
            <div class="podium">
                <div class="podium-card rank-2">
                    <span class="podium-medal">🥈</span>
                    <div class="podium-name">${esc(second.username)}</div>
                    <div class="podium-pts">2nd · <strong>${second.points||0}</strong> pts</div>
                </div>
                <div class="podium-card rank-1">
                    <span class="podium-medal">🥇</span>
                    <div class="podium-name">${esc(first.username)}</div>
                    <div class="podium-pts">1st · <strong>${first.points||0}</strong> pts</div>
                </div>
                <div class="podium-card rank-3">
                    <span class="podium-medal">🥉</span>
                    <div class="podium-name">${esc(third.username)}</div>
                    <div class="podium-pts">3rd · <strong>${third.points||0}</strong> pts</div>
                </div>
            </div>
        </div>`;
    }

    // ---- MOBILE CARDS ----
    const mobileCards = sorted.map((p, i) => {
        const rank     = i + 1;
        const posClass = rank <= 3 ? `pos-${rank}` : '';
        const zone     = rank <= 3 ? 'zone-champ' : (sorted.length >= 5 && rank >= sorted.length - 1 ? 'zone-danger' : '');
        const gd       = (p.gf||0) - (p.ga||0);
        const gdLabel  = gd > 0 ? `+${gd}` : `${gd}`;
        const form     = buildFormMobile(p.form || []);
        return `
        <div class="player-card ${zone}" style="animation-delay:${i * 0.04}s">
            <div class="pc-rank ${posClass}">${rank}</div>
            <div class="pc-info">
                <div class="pc-name">${esc(p.name)}</div>
                <div class="pc-username">${esc(p.username)}</div>

<div class="postponement-badge">
    <i class="fas fa-hourglass-half"></i>
    <span class="pp-count">${p.postponements || 0}</span>&nbsp;left
</div>
                <div class="pc-stats">
                    <div class="pc-stat">P <span>${p.played||0}</span></div>
                    <div class="pc-stat">W <span>${p.wins||0}</span></div>
                    <div class="pc-stat">D <span>${p.draws||0}</span></div>
                    <div class="pc-stat">L <span>${p.losses||0}</span></div>
                    <div class="pc-stat">GD <span>${gdLabel}</span></div>
                </div>
            </div>
            <div class="pc-right">
                <div>
                    <div class="pc-pts">${p.points||0}</div>
                    <div class="pc-pts-label">PTS</div>
                </div>
                <div class="pc-form">${form}</div>
            </div>
        </div>`;
    }).join('');

// ---- DESKTOP TABLE ROWS ----
const tableRows = sorted.map((p, i) => {
    const rank     = i + 1;
    const posClass = rank <= 3 ? `pos-${rank}` : '';
    const zone     = rank <= 3 ? 'zone-champ' : (sorted.length >= 5 && rank >= sorted.length - 1 ? 'zone-danger' : '');
    const gd       = (p.gf || 0) - (p.ga || 0);
    const gdStr    = gd > 0
        ? `<span class="gd-pos">+${gd}</span>`
        : gd < 0
            ? `<span class="gd-neg">${gd}</span>`
            : `<span>0</span>`;

    return `
    <tr class="${zone}">
        <td>
            <span class="pos-badge ${posClass}">${rank}</span>
        </td>

        <td>
            <div class="dt-name">${esc(p.name)}</div>
            <div class="dt-username">@${esc(p.username)}</div>

            <div class="postponement-badge">
                <i class="fas fa-calendar-alt"></i>
                <span class="pp-count">${p.postponements || 0}</span>&nbsp;postponements left
            </div>
        </td>

        <td>${p.played || 0}</td>
        <td>${p.wins || 0}</td>
        <td>${p.draws || 0}</td>
        <td>${p.losses || 0}</td>
        <td>${p.gf || 0}</td>
        <td>${p.ga || 0}</td>
        <td>${gdStr}</td>
        <td class="pts-cell">${p.points || 0}</td>
        <td><div class="form-badges">${buildFormDesktop(p.form || [])}</div></td>
    </tr>`;
}).join('');

const legendDanger = sorted.length >= 5
    ? '<div class="legend-item"><div class="legend-dot danger"></div> Relegation zone</div>'
    : '';

root.innerHTML = `
    ${podiumHTML}
    <div class="section-label">
        <i class="fas fa-trophy"></i> STANDINGS · ${sorted.length} PLAYERS
    </div>

    <div class="player-list">${mobileCards}</div>

    <div class="desktop-table-wrap">
        <table>
            <thead>
                <tr>
                    <th>POS</th>
                    <th>PLAYER</th>
                    <th title="Played">P</th>
                    <th title="Wins">W</th>
                    <th title="Draws">D</th>
                    <th title="Losses">L</th>
                    <th title="Goals For">GF</th>
                    <th title="Goals Against">GA</th>
                    <th title="Goal Difference">GD</th>
                    <th title="Points">PTS</th>
                    <th title="Form (last 5)">FORM</th>
                </tr>
            </thead>
            <tbody>${tableRows}</tbody>
        </table>
    </div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot champ"></div>
            Championship zone
        </div>
        ${legendDanger}
    </div>`;

// ============================================================
// PROFILE — phone/username login (cookie-remembered), stats,
// match history with evidence, and a status gauge
// ============================================================

// ---- COOKIES ----
function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
}
function getCookie(name) {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
}
function eraseCookie(name) {
    document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;`;
}

// ---- LOGIN LOOKUP (matches by username, or by phone tolerant of local-vs-+27 format) ----
function normalizePhone(s) { return String(s || '').replace(/\D/g, ''); }

// SA mobile numbers are 9 significant digits, prefixed either by a local trunk
// "0" (0699906125) or the "27" country code (+27699906125). Comparing digit
// suffixes directly fails because those prefixes are different lengths and the
// digit right after them can legitimately differ (0 vs 7 in that example) — so
// instead compare just the last 9 digits, which is the part that's actually
// unique to the number.
function significantPhoneDigits(s) { return normalizePhone(s).slice(-9); }

function findPlayerByLogin(raw) {
    const v = String(raw || '').trim();
    if (!v) return null;
    const vLower = v.toLowerCase();
    const vSig   = significantPhoneDigits(v);
    return LEAGUE_PLAYERS.find(p => (p.username || '').toLowerCase() === vLower)
        || (vSig.length === 9 && LEAGUE_PLAYERS.find(p => p.phone && significantPhoneDigits(p.phone) === vSig))
        || null;
}

// ---- STATUS GAUGE ----
// Priority: suspended > postponed today > playing today > flagged for catch-up > all clear.
function computeGaugeStatus(player) {
    const uname  = (player.username || '').toLowerCase();
    const inList = list => (list || []).some(f =>
        (f.home || '').toLowerCase() === uname || (f.away || '').toLowerCase() === uname);

    if (player.suspended) return { color: STATUS_COLORS.red, icon: 'fa-ban', label: 'SUSPENDED' };
    if (inList(LEAGUE_FIXTURES.postponed)) return { color: STATUS_COLORS.blue, icon: 'fa-hourglass-half', label: 'POSTPONED' };
    if (inList(LEAGUE_FIXTURES.today)) return { color: STATUS_COLORS.gold, icon: 'fa-futbol', label: 'PLAYS TODAY' };
    if (player.catchup) return { color: STATUS_COLORS.purple, icon: 'fa-forward', label: 'CATCH-UP' };
    return { color: STATUS_COLORS.green, icon: 'fa-circle-check', label: 'ALL CLEAR' };
}

// Ring shows games played relative to the most active player in the league —
// a real progress indicator, not a decorative fake percentage.
function buildGaugeSVG(pct, color) {
    const r = 52, c = 2 * Math.PI * r;
    const dash = c * Math.max(2, Math.min(100, pct)) / 100;
    return `<svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
        <circle cx="66" cy="66" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}"/>
    </svg>`;
}

// ---- LOGIN FORM ----
function renderProfileLoginForm(errorMsg) {
    const root = document.getElementById('profile-root');
    if (!root) return;
    root.innerHTML = `
        <div class="profile-login">
            <i class="fas fa-user-astronaut pl-icon"></i>
            <h3>View your profile</h3>
            <p>Enter your phone number or username to see your stats, match history, and today's status.</p>
            <div class="profile-input-wrap">
                <input type="text" id="profile-login-input" class="profile-input" placeholder="Phone or username" autocomplete="off"
                    onkeydown="if(event.key==='Enter') submitProfileLogin()">
                <button class="profile-submit" onclick="submitProfileLogin()">Go</button>
            </div>
            ${errorMsg ? `<div class="profile-error"><i class="fas fa-triangle-exclamation"></i>&nbsp;${esc(errorMsg)}</div>` : ''}
        </div>`;
}

function submitProfileLogin() {
    const input  = document.getElementById('profile-login-input');
    const val    = input ? input.value.trim() : '';
    const player = findPlayerByLogin(val);
    if (!player) {
        renderProfileLoginForm(val ? `No player found matching "${esc(val)}".` : 'Enter a phone number or username.');
        return;
    }
    setCookie(PROFILE_COOKIE, player.username, 365);
    renderProfileCard(player);
}

function logoutProfile() {
    eraseCookie(PROFILE_COOKIE);
    renderProfileLoginForm();
}

// Called after every data refresh — if a profile is remembered via cookie,
// keep its stats/gauge/history in sync with the latest push. Leaves the
// login form untouched if nobody's logged in yet.
function refreshProfileIfLoaded() {
    const saved = getCookie(PROFILE_COOKIE);
    if (!saved) return;
    const player = LEAGUE_PLAYERS.find(p => p.username === saved);
    if (player) renderProfileCard(player);
}

// ---- PROFILE CARD ----
function renderProfileCard(player) {
    const root = document.getElementById('profile-root');
    if (!root) return;

    const gd       = (player.gf || 0) - (player.ga || 0);
    const status   = computeGaugeStatus(player);
    const maxPlayed = Math.max(1, ...LEAGUE_PLAYERS.map(p => p.played || 0));
    const pct       = Math.round(((player.played || 0) / maxPlayed) * 100);

    const matches = [...LEAGUE_RESULTS]
        .filter(r => r.home === player.username || r.away === player.username)
        .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    const cards = matches.length
        ? matches.map((m, i) => buildMatchCardHTML(m, player.username, i)).join('')
        : '<div class="empty-state" style="padding:30px 10px;"><i class="fas fa-futbol"></i>No matches played yet.</div>';

    root.innerHTML = `
        <div class="profile-card">
            <div class="profile-name">${esc(player.name)}</div>
            <div class="profile-username">@${esc(player.username)}</div>
            <div class="gauge-wrap">
                ${buildGaugeSVG(pct, status.color)}
                <div class="gauge-center">
                    <i class="fas ${status.icon}" style="color:${status.color}"></i>
                    <div class="gauge-status-label" style="color:${status.color}">${status.label}</div>
                </div>
            </div>
            <div class="gauge-caption">${player.played || 0} played · ${maxPlayed} by the league's most active player</div>
            <div class="profile-stat-grid">
                <div class="profile-stat"><span class="ps-val">${player.points || 0}</span><span class="ps-lbl">PTS</span></div>
                <div class="profile-stat"><span class="ps-val">${player.wins||0}-${player.draws||0}-${player.losses||0}</span><span class="ps-lbl">W-D-L</span></div>
                <div class="profile-stat"><span class="ps-val">${gd > 0 ? '+' + gd : gd}</span><span class="ps-lbl">GD</span></div>
                <div class="profile-stat"><span class="ps-val">${player.postponements ?? 0}</span><span class="ps-lbl">POSTP. LEFT</span></div>
            </div>
            <button class="profile-logout" onclick="logoutProfile()"><i class="fas fa-right-from-bracket"></i>&nbsp;Switch profile</button>
        </div>
        <div class="section-label"><i class="fas fa-clock-rotate-left"></i> MATCH HISTORY · ${matches.length}</div>
        <div class="match-list">${cards}</div>`;
}

// ---- HELPERS ----
function buildFormMobile(form) {
    return (form||[]).slice(-5).map(r =>
        r==='W'?'<span class="f-w">W</span>':r==='D'?'<span class="f-d">D</span>':'<span class="f-l">L</span>'
    ).join('');
}

function buildFormDesktop(form) {
    return (form||[]).slice(-5).map(r =>
        r==='W'?'<span class="form-w">W</span>':r==='D'?'<span class="form-d">D</span>':'<span class="form-l">L</span>'
    ).join('');
}

}

// esc() is used by both renderStandings() and renderMatchHistory(), so it lives at top level
function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- INIT ----
renderProfileLoginForm(); // placeholder until first loadData() resolves and checks the cookie
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
